[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moleculariq-single-task-grpo"
version = "0.1.0"
description = "Frozen-data single-task GRPO experiments for MolecularIQ"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
  "accelerate==1.14.0",
  "datasets==5.0.1",
  "huggingface-hub==1.29.0",
  "matplotlib==3.11.1",
  "pandas==3.0.5",
  "PyYAML==6.0.3",
  "rdkit==2026.3.5",
  "tensorboard==2.21.0",
  "torch==2.5.1",
  "transformers==5.16.1",
  "trl==1.12.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.13.2"]

[project.scripts]
miq-stage-training-assets = "miq_grpo.stage_assets:training_main"
miq-stage-evaluation-assets = "miq_grpo.stage_assets:evaluation_main"
miq-build-datasets = "miq_grpo.dataset_builder:main"
miq-validate-dataset = "miq_grpo.dataset_validation:main"
miq-preflight = "miq_grpo.preflight:main"
miq-train = "miq_grpo.train:main"
miq-official-eval = "miq_grpo.official_eval:main"
miq-aggregate = "miq_grpo.reporting:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/miq_grpo/constants.py" = ["E501"]  # Exact pinned upstream system prompt.
