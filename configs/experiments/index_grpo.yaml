schema_version: 1
experiment_id: qwen25_05b_miq_index_grpo_v1
task_family: index
dataset:
  bundle_path: ${MIQ_DATA_BUNDLE}
  selector: index
model:
  id: Qwen/Qwen2.5-0.5B-Instruct
  local_path: ${MIQ_MODEL_PATH}
  expected_revision: ${MIQ_MODEL_REVISION}
  # Keep full-finetune master parameters in FP32; trainer.bf16 still uses
  # BF16 autocast for compute without rounding 1e-6 optimizer updates away.
  dtype: float32
  attention_implementation: sdpa
  local_files_only: true
  trust_remote_code: false
  full_finetune: true
trainer:
  output_root: ${MIQ_RUN_ROOT}
  seed: 130363
  data_seed: 130363
  learning_rate: 1.0e-6
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.99
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  num_train_epochs: 1.0
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  num_generations: 8
  max_completion_length: 192
  temperature: 1.0
  top_p: 0.95
  top_k: 50
  min_p: null
  repetition_penalty: 1.0
  generation_kwargs:
    do_sample: true
  beta: 0.001
  epsilon: 0.2
  scale_rewards: group
  loss_type: dapo
  mask_truncated_completions: true
  gradient_checkpointing: true
  bf16: true
  tf32: true
  use_vllm: false
  logging_steps: 5
  log_completions: true
  num_completions_to_print: 8
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 3
  report_to:
    - tensorboard
  dataloader_num_workers: 4
  remove_unused_columns: false
  save_only_model: false
  restore_callback_states_from_checkpoint: true
reward:
  correctness_weight: 1.0
  format_weight: 0.05
  validity_weight: 0.0
  correct_answer_must_dominate: true
benchmark_integrity:
  official_benchmark_used_for_training: false
  official_benchmark_used_for_hparam_selection: false
  official_benchmark_used_for_prompt_tuning: false
  official_benchmark_used_for_checkpoint_selection: false
  official_benchmark_run_ids: []
